# Modified by Witen Labs in 2026: restrict upstream automation to upstream.
name: Lint (pre-commit)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "main"

permissions: {}

jobs:
  lint:
    if: github.repository == 'corazawaf/coraza-caddy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go run mage.go lint
