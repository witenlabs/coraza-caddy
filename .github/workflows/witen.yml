name: Witen connector CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witen-connector-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash {0}

jobs:
  verify:
    if: github.repository == 'witenlabs/coraza-caddy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -tags=coraza.no_memoize
      XDG_CONFIG_HOME: /tmp/witen-coraza/config
      XDG_DATA_HOME: /tmp/witen-coraza/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          files=$(gofmt -l .) || exit 1
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Unsupported build refuses activation
        run: GOFLAGS= go test -count=1 -run '^TestBuildQualification$' .
      - name: Vet
        run: go vet ./...
      - name: Custom Caddy build
        run: go build -buildvcs=false -trimpath -o build/caddy ./caddy
      - name: Connector module exists
        run: |
          ./build/caddy list-modules > build/modules.txt || exit 1
          grep -Fx http.handlers.waf build/modules.txt
      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
